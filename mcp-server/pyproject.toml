[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "buildmind-mcp"
version = "1.0.0"
description = "BuildMind AI construction-project MCP server (official MCP Python SDK, stdio transport)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["mcp[cli]>=2.3,<3", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
buildmind-mcp = "buildmind_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/buildmind_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
